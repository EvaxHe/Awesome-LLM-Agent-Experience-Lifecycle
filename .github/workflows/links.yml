name: Link Check

on:
  schedule:
    - cron: "23 7 * * 1" # weekly, Monday — catches dead paper/code links
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in README + site
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # arXiv / publisher sites rate-limit bots, so accept those + retry.
          args: >-
            --no-progress --max-concurrency 4 --retry-wait-time 4 --max-retries 3
            --accept 200,206,403,429
            --exclude-mail
            README.md docs/index.html
          fail: false
          output: ./lychee-report.md

      # On the weekly run, file/refresh an issue if anything is broken.
      - name: Open an issue on broken links
        if: env.lychee_exit_code != '0' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Broken links detected by the weekly link check"
          content-filepath: ./lychee-report.md
          labels: broken-links, automated
